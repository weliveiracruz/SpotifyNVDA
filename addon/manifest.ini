name = SpotifyNVDA
summary = "SpotifyNVDA - Listen to Spotify with NVDA"
description = """Sign in with your Spotify account and listen to music from an accessible NVDA window: your playlists, song and playlist search, new playlists and continue the last song. Shortcuts: NVDA+Alt+P opens the window, NVDA+Alt+Space plays or pauses, NVDA+Alt+Left and Right Arrow change the song, NVDA+Alt+Up and Down Arrow change the volume, NVDA+Alt+A says what is playing and NVDA+Alt+U continues the last song. You stay signed in: the session is stored encrypted on this computer. Playback control needs Spotify Premium."""
author = "Wellington Cruz <weliveiracruz@gmail.com>"
url = https://github.com/weliveiracruz/SpotifyNVDA
version = 1.2.0
changelog = """Playlists in a tree: open a playlist with Right Arrow to see its songs and press Enter on a song to play the playlist from it. New: search songs inside your playlists, sort the songs of a playlist (title, artist, album, date added, duration; optionally saving the order on Spotify) and delete a playlist."""
docFileName = readme.html
minimumNVDAVersion = 2024.1.0
lastTestedNVDAVersion = 2026.1.1
