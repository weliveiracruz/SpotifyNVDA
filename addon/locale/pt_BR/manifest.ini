summary = "SpotifyNVDA - Ouça o Spotify com o NVDA"
description = """Entre com a sua conta do Spotify e ouça música em uma janela acessível do NVDA: as suas playlists, busca de músicas e de playlists, criação de playlists e continuar a última música. Atalhos: NVDA+Alt+P abre a janela, NVDA+Alt+Espaço toca ou pausa, NVDA+Alt+Setas para a esquerda e para a direita trocam de música, NVDA+Alt+Setas para cima e para baixo mudam o volume, NVDA+Alt+A diz o que está tocando e NVDA+Alt+U continua a última música. Você continua conectado: a sessão fica guardada de forma criptografada neste computador. Controlar a reprodução exige Spotify Premium."""
changelog = """Um só botão de tocar no lugar de três: toca o item escolhido na árvore (Tocar <nome>) ou toca/pausa, continuando a última música quando nada está carregado. As playlists mostram todas as músicas (até 10.000, o máximo do Spotify) e o número real de músicas. Novo: remover música da sua playlist (botão ou tecla Delete)."""
